<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UsmanStatus Pro - WhatsApp Group Status Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React, ReactDOM, Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fira+Code:wght@600&family=Lora:ital,wght@1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rubik:wght@800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
            waSerif: ['"Lora"', 'serif'],
            waBold: ['"Rubik"', 'sans-serif'],
            waScript: ['"Caveat"', 'cursive']
          },
          colors: {
            brand: {
              DEFAULT: '#5a49ff',
              light: '#f0eeff',
              dark: '#4535e5'
            }
          }
        }
      }
    }
  </script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#fbfcff] text-gray-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- COLOR PALETTE PRESETS ---
    const WA_COLORS = [
      { hex: '#075e54', name: 'Teal Green' },
      { hex: '#128c7e', name: 'Light Teal' },
      { hex: '#25d366', name: 'Emerald' },
      { hex: '#34b7f1', name: 'Sky Blue' },
      { hex: '#00a884', name: 'WhatsApp Green' },
      { hex: '#202c33', name: 'Dark Slate' },
      { hex: '#7356bf', name: 'Purple Orchid' },
      { hex: '#e91e63', name: 'Hot Pink' },
      { hex: '#9c27b0', name: 'Deep Violet' },
      { hex: '#673ab7', name: 'Royal Indigo' },
      { hex: '#3f51b5', name: 'Navy Blue' },
      { hex: '#2196f3', name: 'Dodger Blue' },
      { hex: '#ff5722', name: 'Sunset Orange' },
      { hex: '#f44336', name: 'Crimson Red' },
      { hex: '#ff9800', name: 'Amber Gold' },
      { hex: '#795548', name: 'Warm Mocha' },
      { hex: '#607d8b', name: 'Steel Slate' },
      { hex: '#1f2937', name: 'Charcoal Night' }
    ];

    const FONTS = [
      { id: 'sans', name: 'Clean Sans', class: 'font-sans font-bold' },
      { id: 'bold', name: 'Impact Bold', class: 'font-waBold font-extrabold uppercase tracking-wide' },
      { id: 'serif', name: 'Classic Serif', class: 'font-waSerif italic' },
      { id: 'mono', name: 'Terminal Mono', class: 'font-mono' },
      { id: 'script', name: 'Casual Script', class: 'font-waScript text-3xl tracking-wide' }
    ];

    const INITIAL_GROUPS = [
      { id: 'g1', jid: '120363029482710192@g.us', name: 'VIP Trading Signals & Forex Alpha', membersCount: 894, isExcluded: false, tags: ['crypto', 'signals'] },
      { id: 'g2', jid: '120363198273645102@g.us', name: 'E-Commerce Sellers & DropShippers Hub', membersCount: 1024, isExcluded: false, tags: ['business'] },
      { id: 'g3', jid: '120363294817263541@g.us', name: 'Real Estate Investors UAE & PK', membersCount: 650, isExcluded: false, tags: ['deals'] },
      { id: 'g4', jid: '120363381928374655@g.us', name: 'WhatsApp Marketing & Automation Leads', membersCount: 920, isExcluded: false, tags: ['marketing'] },
      { id: 'g5', jid: '120363847192038471@g.us', name: 'Staff & Internal Dev Operations', membersCount: 28, isExcluded: true, tags: ['internal'] }
    ];

    const INITIAL_STATUSES = [
      {
        id: 'st-1',
        type: 'text',
        content: '🚀 EXCLUSIVE LAUNCH: Get instant 50% discount on all WhatsApp Automation Licenses today only! DM us "PRO" now.',
        backgroundColor: '#7356bf',
        fontStyle: 'bold',
        createdAt: '10:45 AM',
        status: 'posted',
        viewCount: 1420,
        totalDelivered: 4
      },
      {
        id: 'st-2',
        type: 'text',
        content: '⏰ Reminder: Live Webinar starts in 30 minutes! Check the pinned link in group description to claim your VIP access seat.',
        backgroundColor: '#075e54',
        fontStyle: 'sans',
        createdAt: 'Scheduled',
        scheduledFor: '2026-08-28T20:30',
        recurrence: 'daily',
        status: 'scheduled',
        viewCount: 0,
        totalDelivered: 4
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [view, setView] = useState('dashboard'); // 'landing' | 'dashboard'
      const [token, setToken] = useState('USMAN-PRO-DEMO-2026');
      const [activeTab, setActiveTab] = useState('composer'); // 'composer' | 'groups' | 'analytics' | 'queue'
      
      const [groups, setGroups] = useState(INITIAL_GROUPS);
      const [statuses, setStatuses] = useState(INITIAL_STATUSES);
      
      // Status Composer State
      const [statusText, setStatusText] = useState('⚡ Flash Sale Alert: 24-Hour VIP Group Discount is LIVE! Click the link to register now.');
      const [selectedBg, setSelectedBg] = useState('#7356bf');
      const [fontIndex, setFontIndex] = useState(0);
      const [isScheduled, setIsScheduled] = useState(false);
      const [scheduledDate, setScheduledDate] = useState('2026-08-28T20:30');
      const [recurrence, setRecurrence] = useState('once');
      const [dmNotification, setDmNotification] = useState(true);

      // Bulk Importer Modal
      const [showBulkModal, setShowBulkModal] = useState(false);
      const [bulkInput, setBulkInput] = useState('');
      const [stagedGroups, setStagedGroups] = useState([]);

      const activeGroups = groups.filter(g => !g.isExcluded);
      const scheduledPosts = statuses.filter(s => s.status === 'scheduled');
      const currentFont = FONTS[fontIndex];

      const cycleFont = () => {
        setFontIndex((prev) => (prev + 1) % FONTS.length);
      };

      const handlePostOrSchedule = () => {
        if (!statusText.trim()) return;

        const newStatus = {
          id: 'st-' + Date.now(),
          type: 'text',
          content: statusText,
          backgroundColor: selectedBg,
          fontStyle: currentFont.id,
          createdAt: isScheduled ? 'Scheduled' : 'Just now',
          scheduledFor: isScheduled ? scheduledDate : null,
          recurrence: isScheduled ? recurrence : null,
          status: isScheduled ? 'scheduled' : 'posted',
          viewCount: isScheduled ? 0 : Math.floor(Math.random() * 300) + 150,
          totalDelivered: activeGroups.length
        };

        setStatuses([newStatus, ...statuses]);
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        alert(isScheduled ? 'Status successfully added to dispatch queue!' : 'Status broadcasted to all active groups!');
      };

      const handleParseBulk = () => {
        const lines = bulkInput.split('\n').map(l => l.trim()).filter(Boolean);
        const parsed = lines.map((line, idx) => {
          const parts = line.split(',');
          let jid = parts[0].trim();
          if (!jid.includes('@g.us')) jid += '@g.us';
          const name = parts[1]?.trim() || `Group ${idx + 1}`;
          const members = parseInt(parts[2]?.trim()) || Math.floor(Math.random() * 400) + 50;
          return { id: 'grp-bulk-' + Date.now() + '-' + idx, jid, name, membersCount: members, isExcluded: false, tags: ['imported'] };
        });
        setStagedGroups(parsed);
      };

      const handleConfirmBulk = () => {
        setGroups([...stagedGroups, ...groups]);
        setShowBulkModal(false);
        setBulkInput('');
        setStagedGroups([]);
        confetti({ particleCount: 60, spread: 70 });
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header Bar */}
          <header className="bg-white border-b border-gray-200 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-brand flex items-center justify-center text-white font-bold shadow-md shadow-brand/20">
                  U
                </div>
                <div>
                  <h1 className="font-bold text-gray-900 leading-tight">UsmanStatus Pro</h1>
                  <span className="text-[11px] text-gray-500 font-mono">Baileys Multi-Device Engine</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  Multi-Device Connected
                </div>
                <div className="px-3 py-1 bg-brand-light text-brand font-mono text-xs font-bold rounded-lg border border-brand/20">
                  {token}
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto border-t border-gray-100 py-1.5">
              {[
                { id: 'composer', label: 'Status Composer & Preview' },
                { id: 'queue', label: `Scheduled Queue (${scheduledPosts.length})` },
                { id: 'groups', label: `Groups & JIDs (${activeGroups.length} Active)` },
                { id: 'analytics', label: '7-Day Engagement' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                    activeTab === tab.id
                      ? 'bg-brand text-white shadow-sm'
                      : 'text-gray-600 hover:bg-gray-100'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </header>

          {/* Main Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {/* TAB 1: COMPOSER */}
            {activeTab === 'composer' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                {/* Left: Interactive Controls (7 cols) */}
                <div className="lg:col-span-7 space-y-6">
                  {/* Text Input Box */}
                  <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-4">
                    <div className="flex items-center justify-between">
                      <label className="text-sm font-bold text-gray-900">Status Text Message</label>
                      <button
                        onClick={cycleFont}
                        className="text-xs font-bold px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg flex items-center gap-1.5 transition"
                      >
                        <span>Font: {currentFont.name}</span>
                        <span className="text-brand font-mono">↻</span>
                      </button>
                    </div>

                    <textarea
                      rows={4}
                      value={statusText}
                      onChange={(e) => setStatusText(e.target.value)}
                      placeholder="Type your WhatsApp status here..."
                      className="w-full p-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand/40 text-sm font-sans"
                    />

                    {/* Color Swatches */}
                    <div>
                      <span className="text-xs font-bold text-gray-600 block mb-2">
                        WhatsApp Background Colors ({WA_COLORS.length} Presets)
                      </span>
                      <div className="grid grid-cols-6 sm:grid-cols-9 gap-2">
                        {WA_COLORS.map(c => (
                          <button
                            key={c.hex}
                            onClick={() => setSelectedBg(c.hex)}
                            title={c.name}
                            style={{ backgroundColor: c.hex }}
                            className={`h-9 rounded-xl transition transform hover:scale-105 flex items-center justify-center ${
                              selectedBg === c.hex ? 'ring-3 ring-offset-2 ring-brand scale-105 shadow-sm' : ''
                            }`}
                          >
                            {selectedBg === c.hex && <span className="text-white text-xs font-bold">✓</span>}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Scheduling Controls */}
                  <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="text-sm font-bold text-gray-900">Schedule Broadcast</h3>
                        <p className="text-xs text-gray-500">Dispatch at highest engagement peak</p>
                      </div>
                      <input
                        type="checkbox"
                        checked={isScheduled}
                        onChange={(e) => setIsScheduled(e.target.checked)}
                        className="w-5 h-5 accent-brand rounded cursor-pointer"
                      />
                    </div>

                    {isScheduled && (
                      <div className="p-4 bg-gray-50 rounded-xl space-y-3 border border-gray-200">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-xs font-bold text-gray-600 block mb-1">Dispatch Date & Time</label>
                            <input
                              type="datetime-local"
                              value={scheduledDate}
                              onChange={(e) => setScheduledDate(e.target.value)}
                              className="w-full px-3 py-2 bg-white rounded-lg border border-gray-300 text-xs font-mono"
                            />
                          </div>
                          <div>
                            <label className="text-xs font-bold text-gray-600 block mb-1">Recurrence</label>
                            <select
                              value={recurrence}
                              onChange={(e) => setRecurrence(e.target.value)}
                              className="w-full px-3 py-2 bg-white rounded-lg border border-gray-300 text-xs"
                            >
                              <option value="once">One-Time Only</option>
                              <option value="daily">Daily Auto-Post</option>
                              <option value="weekly">Weekly</option>
                            </select>
                          </div>
                        </div>

                        {/* Prime Time Shortcuts */}
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          <button
                            onClick={() => setScheduledDate('2026-08-28T20:30')}
                            className="px-2 py-1 bg-white hover:bg-gray-100 rounded text-[11px] border border-gray-200 text-gray-700"
                          >
                            Tonight Peak (8:30 PM)
                          </button>
                          <button
                            onClick={() => setScheduledDate('2026-08-29T09:00')}
                            className="px-2 py-1 bg-white hover:bg-gray-100 rounded text-[11px] border border-gray-200 text-gray-700"
                          >
                            Tomorrow Morning (9:00 AM)
                          </button>
                        </div>
                      </div>
                    )}

                    {/* Dispatch Button */}
                    <button
                      onClick={handlePostOrSchedule}
                      className="w-full py-3.5 bg-brand hover:bg-brand-dark text-white rounded-xl font-bold text-sm shadow-md transition"
                    >
                      {isScheduled ? `Queue Scheduled Status (${activeGroups.length} Groups)` : `Broadcast to ${activeGroups.length} Active Groups Now`}
                    </button>
                  </div>
                </div>

                {/* Right: Authentic WhatsApp Status Phone Preview (5 cols) */}
                <div className="lg:col-span-5 flex justify-center">
                  <div className="w-[320px] sm:w-[350px] bg-[#111b21] rounded-[2.5rem] p-3 shadow-2xl border-4 border-gray-800 relative">
                    {/* Status Canvas Box */}
                    <div
                      style={{ backgroundColor: selectedBg }}
                      className="h-[520px] rounded-[2rem] p-6 flex flex-col justify-between text-white relative overflow-hidden transition-colors duration-300"
                    >
                      {/* Top Header */}
                      <div>
                        {/* Progress Bar */}
                        <div className="w-full bg-white/30 h-1 rounded-full overflow-hidden mb-3">
                          <div className="w-1/3 bg-white h-full"></div>
                        </div>

                        <div className="flex items-center justify-between text-xs">
                          <div className="flex items-center gap-2">
                            <div className="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center font-bold text-[10px]">
                              VIP
                            </div>
                            <div>
                              <div className="font-bold leading-tight">My Group Status</div>
                              <div className="text-[10px] text-white/80">Just now · {activeGroups.length} Groups</div>
                            </div>
                          </div>
                          <button onClick={cycleFont} className="text-sm bg-black/20 px-2 py-0.5 rounded-full font-mono">
                            T
                          </button>
                        </div>
                      </div>

                      {/* Centered Message */}
                      <div className="my-auto text-center px-2">
                        <p className={`text-lg leading-relaxed drop-shadow-md break-words ${currentFont.class}`}>
                          {statusText || 'Status text goes here...'}
                        </p>
                      </div>

                      {/* Bottom Footer & Views */}
                      <div className="text-center pt-2 border-t border-white/10">
                        <div className="inline-flex items-center gap-1.5 bg-black/30 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold">
                          <span>👁️ {activeGroups.length * 280} potential views</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: SCHEDULED QUEUE */}
            {activeTab === 'queue' && (
              <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-4">
                <div className="flex items-center justify-between border-b pb-4">
                  <div>
                    <h3 className="font-bold text-gray-900">Queued Broadcasts</h3>
                    <p className="text-xs text-gray-500">Statuses scheduled for automated dispatch</p>
                  </div>
                  <span className="text-xs bg-brand-light text-brand px-3 py-1 rounded-full font-bold">
                    {scheduledPosts.length} Queued
                  </span>
                </div>

                {scheduledPosts.length === 0 ? (
                  <p className="text-xs text-gray-400 text-center py-8">No scheduled broadcasts in queue.</p>
                ) : (
                  <div className="space-y-3">
                    {scheduledPosts.map(s => (
                      <div key={s.id} className="p-4 rounded-xl border border-gray-200 flex items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg shrink-0" style={{ backgroundColor: s.backgroundColor }}></div>
                          <div>
                            <p className="text-xs font-bold text-gray-800 line-clamp-1">{s.content}</p>
                            <span className="text-[11px] text-gray-500 font-mono">
                              ⏰ {s.scheduledFor} · Recurrence: {s.recurrence || 'Once'}
                            </span>
                          </div>
                        </div>
                        <button
                          onClick={() => setStatuses(statuses.filter(st => st.id !== s.id))}
                          className="text-xs text-rose-600 hover:text-rose-700 font-bold"
                        >
                          Cancel
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: GROUPS & BULK IMPORTER */}
            {activeTab === 'groups' && (
              <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b pb-4">
                  <div>
                    <h3 className="font-bold text-gray-900">Connected WhatsApp Groups</h3>
                    <p className="text-xs text-gray-500">Toggle groups to include/exclude from broadcasts</p>
                  </div>
                  <button
                    onClick={() => setShowBulkModal(true)}
                    className="px-4 py-2 bg-brand text-white rounded-xl text-xs font-bold shadow-sm"
                  >
                    + Bulk Import JIDs (CSV / TXT)
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {groups.map(g => (
                    <div
                      key={g.id}
                      className={`p-4 rounded-xl border transition flex items-center justify-between ${
                        g.isExcluded ? 'bg-gray-50 border-gray-200 opacity-60' : 'bg-white border-gray-200 hover:border-brand/40 shadow-xs'
                      }`}
                    >
                      <div>
                        <div className="font-bold text-xs text-gray-900">{g.name}</div>
                        <div className="text-[11px] font-mono text-gray-400">{g.jid}</div>
                        <div className="text-[10px] text-gray-500 mt-1">{g.membersCount} members</div>
                      </div>
                      <button
                        onClick={() => {
                          setGroups(groups.map(item => item.id === g.id ? { ...item, isExcluded: !item.isExcluded } : item));
                        }}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                          g.isExcluded ? 'bg-gray-200 text-gray-600' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                        }`}
                      >
                        {g.isExcluded ? 'Excluded' : 'Active'}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: ANALYTICS */}
            {activeTab === 'analytics' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-gray-200">
                    <span className="text-xs text-gray-500 font-bold">Total Status Views</span>
                    <div className="text-2xl font-extrabold text-gray-900 mt-1">27,420</div>
                    <span className="text-[11px] text-emerald-600 font-bold">+28% this week</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-gray-200">
                    <span className="text-xs text-gray-500 font-bold">Prime Peak Window</span>
                    <div className="text-2xl font-extrabold text-amber-600 mt-1">8:00 - 9:30 PM</div>
                    <span className="text-[11px] text-gray-400">Highest view conversions</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-gray-200">
                    <span className="text-xs text-gray-500 font-bold">Direct DM Inquiries</span>
                    <div className="text-2xl font-extrabold text-purple-600 mt-1">340 Leads</div>
                    <span className="text-[11px] text-purple-700 font-bold">9.4% Reply rate</span>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl border border-gray-200 space-y-4">
                  <h3 className="font-bold text-gray-900 text-sm">24-Hour Viewing Trend (Average Views Per Hour)</h3>
                  {/* Clean SVG Bar Chart */}
                  <div className="h-48 flex items-end gap-1 sm:gap-2 pt-8 px-2 border-b border-gray-200">
                    {[
                      { h: '00', v: 40 }, { h: '03', v: 15 }, { h: '06', v: 80 }, { h: '09', v: 240 },
                      { h: '12', v: 360 }, { h: '15', v: 310 }, { h: '18', v: 620 }, { h: '20', v: 980 },
                      { h: '21', v: 890 }, { h: '22', v: 610 }, { h: '23', v: 280 }
                    ].map((item, i) => (
                      <div key={i} className="flex-1 flex flex-col items-center gap-1 group relative">
                        <div
                          style={{ height: `${(item.v / 1000) * 100}%` }}
                          className={`w-full rounded-t transition-all ${
                            item.h === '20' ? 'bg-brand' : 'bg-brand/30 hover:bg-brand/60'
                          }`}
                        ></div>
                        <span className="text-[10px] text-gray-400 font-mono">{item.h}:00</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* BULK IMPORT MODAL */}
          {showBulkModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white max-w-lg w-full rounded-2xl p-6 space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-gray-900 text-sm">Bulk Import Group JIDs</h3>
                  <button onClick={() => setShowBulkModal(false)} className="text-gray-400 font-bold">✕</button>
                </div>

                <p className="text-xs text-gray-500">
                  Paste rows format: <code className="font-mono text-brand">jid, group_name, members_count</code>
                </p>

                <textarea
                  rows={5}
                  value={bulkInput}
                  onChange={(e) => setBulkInput(e.target.value)}
                  placeholder="12036399999999@g.us, Crypto Signals VIP, 450&#10;12036388888888@g.us, Dropship Hub, 820"
                  className="w-full p-3 border rounded-xl font-mono text-xs focus:ring-2 focus:ring-brand/40"
                />

                <div className="flex justify-between items-center pt-2">
                  <button
                    onClick={handleParseBulk}
                    className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl text-xs font-bold"
                  >
                    Parse Rows ({bulkInput.split('\n').filter(Boolean).length})
                  </button>

                  <button
                    disabled={stagedGroups.length === 0}
                    onClick={handleConfirmBulk}
                    className="px-5 py-2 bg-brand hover:bg-brand-dark text-white rounded-xl text-xs font-bold disabled:opacity-50"
                  >
                    Import {stagedGroups.length} Groups
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-gray-200 bg-white py-4 px-6 text-center text-xs text-gray-400">
            UsmanStatus Pro Baileys Protocol &copy; 2026 · Token Session: <code className="font-mono text-gray-700 font-bold">{token}</code>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
